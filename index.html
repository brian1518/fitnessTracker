<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Workout Tracker</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center mb-4">🏋️‍♂️ Gym Workout Tracker</h1>

    <div class="card p-4 shadow-sm">
      <div class="mb-3">
        <label for="exercise" class="form-label">Exercise</label>
        <input list="exerciseList" id="exercise" class="form-control" placeholder="Start typing...">
        <datalist id="exerciseList"></datalist>
      </div>

      <div class="mb-3">
        <label for="weight" class="form-label">Weight (kg)</label>
        <input id="weight" type="number" class="form-control" placeholder="Weight (kg)" min="1">
      </div>

      <div class="mb-3">
        <label for="reps" class="form-label">Reps</label>
        <input id="reps" type="number" class="form-control" placeholder="Reps" min="1">
      </div>

      <button id="addBtn" class="btn btn-turquoise w-100">Add Workout</button>
    </div>

    <ul id="workoutList" class="list-group mt-4"></ul>
  </div>

  <!-- Bootstrap JS (optional for interactivity) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
